services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: researchdesk
      POSTGRES_USER: researchdesk
      POSTGRES_PASSWORD: researchdesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchdesk -d researchdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=researchdesk;Username=researchdesk;Password=researchdesk
      DisableHttpsRedirection: "true"
    ports:
      - "8080:8080"

volumes:
  pgdata:
